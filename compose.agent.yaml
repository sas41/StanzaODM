# On each target host:
# 1. Set STANZA_CONTROL_PLANE_URL to the HTTPS Control Plane origin.
# 2. Generate an enrollment token in /agents and set STANZA_ENROLLMENT_TOKEN.
# 3. Set STANZA_DOCKER_GID to: stat -c %g /var/run/docker.sock
# 4. Set STANZA_VERSION to the SAME published UTC release tag as the Control Plane.
# 5. Run: docker compose -f compose.agent.yaml up -d
# The Agent opens only outbound management connections; no host ports are published.
# Docker socket access is effectively privileged host access. Host actions require the separate opt-in
# compose.agent.privileged.yaml override; the ordinary Agent remains non-root without host namespaces.
# Data root must be a dedicated absolute host path. It is mounted at the SAME path inside the
# Agent so relative Compose bind mounts resolve correctly on the host Docker daemon.
name: stanza-agent
services:
  initialize-agent:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        if [ -n "$$(ls -A /agent-data)" ] && [ ! -f /agent-data/identity.pk8 ]; then
          echo 'Refusing to claim a nonempty directory without an Agent identity. Use a dedicated data directory.' >&2
          exit 1
        fi
        if [ -n "$$(ls -A /agent-data)" ] && [ "$$(stat -c %u /agent-data)" != 1654 ]; then
          echo 'Existing Agent data must be owned by UID 1654. No files were changed.' >&2
          exit 1
        fi
        chown 1654:1654 /agent-data
        chmod 0700 /agent-data
        if [ -L /agent-data/identity.pk8 ]; then exit 1; fi
        if [ -f /agent-data/identity.pk8 ]; then chown 1654:1654 /agent-data/identity.pk8; fi
        for store in request-ledger credentials runtime-home configuration-cache; do
          if [ -L "/agent-data/$$store" ]; then exit 1; fi
          mkdir -p "/agent-data/$$store"
          chown -hR 1654:1654 "/agent-data/$$store"
          chmod 0700 "/agent-data/$$store"
        done
        mkdir -p /agent-data/operation-workspaces
        chown 1654:1654 /agent-data/operation-workspaces
    volumes:
      - ${STANZA_AGENT_DATA_ROOT:-/var/lib/stanza-agent}:/agent-data
    restart: "no"

  agent:
    image: ghcr.io/sas41/stanzaodm-agent:${STANZA_VERSION:?Set STANZA_VERSION to the shared UTC image version (YYYY-MM-DD-HHMMSS)}
    pull_policy: always
    environment:
      Agent__ControlPlaneUrl: ${STANZA_CONTROL_PLANE_URL:?Set STANZA_CONTROL_PLANE_URL to your HTTPS Control Plane origin}
      Agent__EnrollmentToken: ${STANZA_ENROLLMENT_TOKEN:?Generate an enrollment token in the Control Plane UI}
      Agent__PersistentDataRoot: ${STANZA_AGENT_DATA_ROOT:-/var/lib/stanza-agent}
      Agent__Docker__EnableExecution: "true"
    group_add:
      - "${STANZA_DOCKER_GID:?Set STANZA_DOCKER_GID to the host Docker socket group ID}"
    volumes:
      - ${STANZA_AGENT_DATA_ROOT:-/var/lib/stanza-agent}:${STANZA_AGENT_DATA_ROOT:-/var/lib/stanza-agent}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      initialize-agent:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
